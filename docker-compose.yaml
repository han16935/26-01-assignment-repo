version: "3.8"

services:
  postgres:
    image: postgres:15.8
    container_name: library-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: library
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      TZ: Asia/Seoul

  redis:
    image: redis:8.4.0-alpine
    container_name: redis
    command: [ "redis-server" ]
    ports:
      - "6379:6379"
    restart: always
